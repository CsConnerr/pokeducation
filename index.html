<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6ce46">
  <meta name="description" content="Count Pokémon, add two groups, and choose the answer. A simple addition game for little learners.">
  <title>Pokémon Count Club</title>
  <style>
    :root { color-scheme: light; --ink: #20344b; --muted: #54657a; --blue: #265fc7; --yellow: #f6ce46; --line: #d8e4ed; --green: #206342; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100svh; background-color: #f2f7fb; background-image: linear-gradient(#dce7ef66 1px, transparent 1px), linear-gradient(90deg, #dce7ef66 1px, transparent 1px); background-size: 28px 28px; color: var(--ink); font-family: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:disabled { cursor: default; }
    button:focus-visible, a:focus-visible, input:focus-visible + span { outline: 4px solid var(--blue); outline-offset: 5px; }
    .shell { width: min(1040px, calc(100% - 48px)); margin: 0 auto; }
    .topbar { min-height: 112px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 0; }
    .brand { line-height: 1; transform: rotate(-2deg); }
    .brand-name { display: block; width: fit-content; font-size: 1.85rem; letter-spacing: -.06em; font-weight: 900; }
    .brand-sub { display: block; margin-top: 6px; width: fit-content; padding: 5px 8px; background: var(--yellow); font-size: .8rem; font-weight: 900; letter-spacing: .16em; }
    .score { display: flex; align-items: center; gap: 9px; background: #fff; padding: 11px 16px; border: 1.5px solid var(--line); border-radius: 99px; font-size: .95rem; font-weight: 700; white-space: nowrap; }
    .score svg { width: 22px; height: 22px; color: #b87800; fill: #f6ce46; }
    main { padding: 16px 0 0; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 25px; }
    h1 { margin: 0; font-size: clamp(1.8rem, 3.7vw, 2.65rem); line-height: 1.12; font-weight: 900; letter-spacing: -.04em; }
    .intro p { margin: 10px 0 0; font-size: 1.02rem; color: var(--muted); line-height: 1.5; }
    fieldset { border: 0; padding: 0; margin: 0 0 2px; flex-shrink: 0; }
    legend { font-size: .875rem; font-weight: 700; padding: 0; margin-bottom: 8px; }
    .levels { display: flex; gap: 4px; background: #e3eaf1; padding: 5px; border-radius: 13px; }
    .level { position: relative; cursor: pointer; }
    .level input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .level span { display: block; padding: 11px 15px; border-radius: 9px; font-size: .9rem; font-weight: 800; transition: background .15s; }
    .level input:checked + span { background: #fff; box-shadow: 0 2px 4px #20344b18; color: var(--blue); }
    .game-card { position: relative; background: #fff; border: 2px solid var(--ink); border-radius: 25px; box-shadow: 0 7px 0 var(--ink); overflow: hidden; }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 20px 28px; border-bottom: 1.5px solid var(--line); }
    .round { font-size: .875rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .species { display: flex; align-items: center; gap: 7px; font-size: .95rem; color: var(--muted); }
    .species strong { color: var(--ink); font-weight: 800; }
    .play-area { padding: 28px 32px 23px; }
    .groups { display: grid; grid-template-columns: minmax(0, 1fr) 68px minmax(0, 1fr); align-items: center; }
    .group { border: 2px solid #b5d3f2; background: #f0f7ff; border-radius: 19px; min-height: 188px; padding: 20px 12px; display: flex; align-items: center; justify-content: center; }
    .group.second { background: #fff9e5; border-color: #eace72; }
    .sprite-grid { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; max-width: 300px; }
    .sprite { position: relative; display: block; flex: 0 0 auto; width: 80px; height: 80px; overflow: hidden; user-select: none; }
    .sprite img { position: absolute; display: block; max-width: none; image-rendering: pixelated; -webkit-user-drag: none; }
    .plus { text-align: center; font-family: "Trebuchet MS", sans-serif; font-size: 3.5rem; font-weight: 900; }
    .equation { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 16px; margin-top: 22px; font-size: 2rem; line-height: 1.1; font-weight: 800; }
    .equation .num { min-width: 43px; text-align: center; }
    .equation .operator { color: #6d7c8e; font-size: 1.7rem; }
    .unknown { display: grid; place-items: center; width: 51px; height: 51px; border: 2px dashed #9aabc0; border-radius: 12px; color: #596d87; background: #f5f8fc; }
    .answer-area { padding: 21px 32px 27px; background: #fafcfe; border-top: 1.5px solid var(--line); text-align: center; }
    .answer-label { font-size: 1.075rem; font-weight: 800; margin: 0 0 17px; }
    .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(3.7rem, 100%), 1fr)); gap: 15px; max-width: 600px; margin: 0 auto; }
    .answer { position: relative; min-height: 79px; padding: 12px; font-size: 2.2rem; line-height: 1.15; font-weight: 900; border: 2px solid var(--ink); border-radius: 15px; color: var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .12s; }
    .answer:not(:disabled):hover { background: #fff1b5; transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
    .answer:not(:disabled):active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
    .answer.wrong { background: #fff1e7; border-color: #b9571b; color: #8e3e12; box-shadow: 0 4px 0 #b9571b; animation: wiggle .25s; }
    .feedback { min-height: 24px; margin: 16px 0 0; font-size: .95rem; color: var(--muted); line-height: 1.5; }
    .feedback.retry { color: #934319; font-weight: 700; }
    .result { padding: 27px 28px 24px; text-align: center; }
    .success-heading { font-size: 1.8rem; font-weight: 900; color: var(--green); margin: 0 0 7px; letter-spacing: -.025em; }
    .result p { font-size: 1.075rem; margin: 0; color: var(--muted); }
    .total-group { display: flex; justify-content: center; align-items: center; background: #f0faf1; border: 2px solid #a0cca9; border-radius: 19px; padding: 16px; min-height: 150px; margin: 20px auto 0; max-width: 730px; }
    .total-group .sprite-grid { max-width: 650px; gap: 7px; }
    .total-group .sprite { animation: pop .3s both; animation-delay: var(--delay, 0ms); }
    .result .equation { color: var(--green); margin-top: 20px; }
    .result .total { background: #d8f0d9; min-width: 55px; min-height: 51px; padding: 8px 11px; border-radius: 12px; }
    .next-area { border-top: 1.5px solid #cce0cf; padding: 23px 24px; background: #f6fbf6; text-align: center; }
    .next { display: inline-flex; justify-content: center; align-items: center; gap: 14px; min-height: 62px; min-width: 250px; max-width: 100%; padding: 15px 24px; background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); border-radius: 13px; box-shadow: 0 4px 0 var(--ink); font-weight: 900; font-size: 1.15rem; transition: transform .12s, box-shadow .12s; }
    .next:hover { background: #ffdc66; }
    .next:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
    .next svg { width: 20px; height: 20px; }
    .footer { padding: 26px 0 20px; text-align: center; color: var(--muted); font-size: .8rem; line-height: 1.7; }
    .footer a { color: #3a5876; text-underline-offset: 3px; }
    .footer p { margin: 0; }
    .copyright { font-size: .75rem; color: #64748b; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    noscript p { margin: 24px; padding: 24px; border: 2px solid var(--ink); background: #fff; text-align: center; }
    @keyframes pop { from { opacity: 0; transform: scale(.6) translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes wiggle { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    @media (max-width: 700px) {
      .shell { width: min(600px, calc(100% - 32px)); }
      .topbar { min-height: 94px; }
      main { padding-top: 8px; }
      .intro { align-items: flex-start; flex-direction: column; gap: 17px; margin-bottom: 20px; }
      fieldset { display: flex; flex-direction: column; width: 100%; }
      legend { float: left; margin: 0 0 6px; }
      .levels { width: fit-content; }
      .level span { padding: 10px 17px; }
      h1 { font-size: 2rem; max-width: 480px; }
      .intro p { margin-top: 8px; }
      .card-top { padding: 17px 20px; }
      .play-area { padding: 21px 18px; }
      .groups { grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr); }
      .plus { font-size: 2.8rem; }
      .group { min-height: 168px; padding: 12px 7px; border-radius: 15px; }
      .sprite { width: 64px; height: 64px; }
      .sprite-grid { gap: 2px; }
      .answer-area { padding: 21px 20px 20px; }
      .answers { gap: 12px; }
      .answer { min-height: 71px; font-size: 2rem; }
      .result { padding: 23px 18px; }
      .total-group { padding: 14px 8px; }
      .total-group .sprite-grid { max-width: 380px; gap: 4px; }
    }
    @media (max-width: 420px) {
      .shell { width: calc(100% - 24px); }
      .topbar { min-height: 86px; }
      .brand-name { font-size: 1.65rem; }
      .brand-sub { font-size: .7rem; }
      .score { padding: 9px 12px; font-size: .85rem; }
      h1 { font-size: 1.78rem; }
      .intro { gap: 13px; margin-bottom: 16px; }
      .intro p { font-size: .95rem; }
      .game-card { border-radius: 20px; }
      .card-top { padding: 14px 15px; flex-wrap: wrap; }
      .round { font-size: .8rem; }
      .species { font-size: .875rem; }
      .play-area { padding: 18px 12px; }
      .groups { grid-template-columns: minmax(0, 1fr) 31px minmax(0, 1fr); }
      .group { padding: 10px 4px; min-height: 136px; }
      .sprite { width: 52px; height: 52px; }
      .plus { font-size: 2.4rem; }
      .equation { font-size: 1.8rem; gap: 10px; margin-top: 17px; }
      .answer-area { padding: 18px 14px; }
      .answer-label { margin-bottom: 14px; }
      .answers { gap: 9px; }
      .answer { min-height: 63px; font-size: 1.85rem; padding: 10px 5px; border-radius: 12px; }
      .feedback { font-size: .875rem; margin-top: 14px; }
      .total-group .sprite-grid { max-width: 292px; gap: 4px; }
      .total-group .sprite { width: 52px; height: 52px; }
      .footer { padding-top: 22px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Pokémon Count Club"><span class="brand-name">Pokémon</span><span class="brand-sub">COUNT CLUB</span></div>
      <div class="score"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 2.5 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span id="score">0 solved</span></div>
    </header>
    <main>
      <div class="intro">
        <div><h1>How many Pokémon<br>altogether?</h1><p>Count each group, then choose a number.</p></div>
        <fieldset id="difficulty"><legend>Addition practice</legend><div class="levels"><label class="level"><input type="radio" name="limit" value="5" checked><span>Up to 5</span></label><label class="level"><input type="radio" name="limit" value="10"><span>Up to 10</span></label></div></fieldset>
      </div>
      <section class="game-card" aria-label="Pokémon addition game">
        <div class="card-top"><span class="round" id="round">Question 1</span><span class="species">Let’s count <strong id="species"></strong></span></div>
        <div id="question-view">
          <div class="play-area">
            <div class="groups"><div class="group" id="group-a" role="img"></div><span class="plus" aria-hidden="true">+</span><div class="group second" id="group-b" role="img"></div></div>
            <div class="equation" id="question-equation" role="img"></div>
          </div>
          <div class="answer-area"><p class="answer-label" id="answer-label">How many in all?</p><div class="answers" id="answers" role="group" aria-labelledby="answer-label"></div><p class="feedback" id="feedback" aria-live="polite" aria-atomic="true">Take your time. You can do it!</p></div>
        </div>
        <div id="result-view" hidden>
          <div class="result"><h2 class="success-heading">You got it!</h2><p id="result-copy"></p><div class="total-group" id="total-group" role="img"></div><div class="equation" id="result-equation" role="img"></div></div>
          <div class="next-area"><button class="next" id="next" type="button">Next question<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div>
        </div>
      </section>
      <p class="sr-only" role="status" id="announcement" aria-atomic="true"></p>
    </main>
    <footer class="footer"><p>Sprites from <a href="https://pokemondb.net/sprites" target="_blank" rel="noopener noreferrer">Pokémon Database</a>.</p><p class="copyright">Pokémon © Nintendo / Creatures Inc. / GAME FREAK inc.</p></footer>
  </div>
  <noscript><p>Please enable JavaScript to play the counting game.</p></noscript>

  <script>
    'use strict';
    const POKEMON = JSON.parse(document.getElementById('pokemon-assets').textContent);
    const ui = Object.fromEntries(['score', 'round', 'species', 'group-a', 'group-b', 'question-equation', 'answers', 'feedback', 'question-view', 'result-view', 'total-group', 'result-copy', 'result-equation', 'next', 'announcement'].map(id => [id, document.getElementById(id)]));
    const state = { limit: 5, solved: 0, round: 0, question: null, answered: false, bag: [], lastSpecies: null, previousPair: '' };
    function shuffle(items) {
      const array = [...items];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    function nextPokemon() {
      if (!state.bag.length) {
        state.bag = shuffle(POKEMON);
        if (state.bag.length > 1 && state.bag[state.bag.length - 1].name === state.lastSpecies) {
          [state.bag[0], state.bag[state.bag.length - 1]] = [state.bag[state.bag.length - 1], state.bag[0]];
        }
      }
      const pokemon = state.bag.pop();
      state.lastSpecies = pokemon.name;
      return pokemon;
    }
    function makeQuestion(limit, previousPair) {
      const pairs = [];
      for (let a = 1; a <= Math.min(5, limit - 1); a++) {
        for (let b = 1; b <= Math.min(5, limit - 1); b++) {
          if (a + b <= limit && `${a},${b}` !== previousPair) pairs.push([a, b]);
        }
      }
      const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
      const total = a + b;
      const alternatives = Array.from({ length: limit }, (_, index) => index + 1).filter(n => n !== total);
      return { a, b, total, options: shuffle([total, ...shuffle(alternatives).slice(0, 3)]) };
    }
    function renderSprites(container, count, pokemon, animate = false) {
      container.replaceChildren();
      container.setAttribute('aria-label', `${count} ${pokemon.name} Pokémon`);
      const grid = document.createElement('div');
      grid.className = 'sprite-grid';
      for (let i = 0; i < count; i++) {
        const slot = document.createElement('span');
        slot.className = 'sprite';
        const img = document.createElement('img');
        img.src = pokemon.src;
        img.alt = '';
        img.width = 96;
        img.height = 96;
        img.draggable = false;
        const [left, top, right, bottom] = pokemon.bounds;
        const scale = .86 / Math.max(right - left, bottom - top);
        img.style.width = `${9600 * scale}%`;
        img.style.height = `${9600 * scale}%`;
        img.style.left = `${50 - (left + right) / 2 * scale * 100}%`;
        img.style.top = `${50 - (top + bottom) / 2 * scale * 100}%`;
        if (animate) slot.style.setProperty('--delay', `${i * 50}ms`);
        slot.append(img);
        grid.append(slot);
      }
      container.append(grid);
    }
    function renderEquation(container, a, b, total) {
      container.replaceChildren();
      const pieces = [{ text: a, className: 'num' }, { text: '+', className: 'operator' }, { text: b, className: 'num' }, { text: '=', className: 'operator' }, { text: total === null ? '?' : total, className: total === null ? 'unknown' : 'total' }];
      pieces.forEach(piece => {
        const span = document.createElement('span');
        span.textContent = piece.text;
        span.className = piece.className;
        span.setAttribute('aria-hidden', 'true');
        container.append(span);
      });
      container.setAttribute('aria-label', `${a} plus ${b} equals ${total === null ? 'how many?' : total}`);
    }
    function newQuestion(focusAnswers = false) {
      state.answered = false;
      state.round++;
      const question = makeQuestion(state.limit, state.previousPair);
      state.previousPair = `${question.a},${question.b}`;
      question.pokemon = nextPokemon();
      state.question = question;
      ui.round.textContent = `Question ${state.round}`;
      ui.species.textContent = question.pokemon.name;
      ui['question-view'].hidden = false;
      ui['result-view'].hidden = true;
      ui['total-group'].replaceChildren();
      ui.feedback.textContent = 'Take your time. You can do it!';
      ui.feedback.className = 'feedback';
      renderSprites(ui['group-a'], question.a, question.pokemon);
      renderSprites(ui['group-b'], question.b, question.pokemon);
      renderEquation(ui['question-equation'], question.a, question.b, null);
      ui.answers.replaceChildren();
      question.options.forEach(value => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer';
        button.textContent = value;
        button.setAttribute('aria-label', `${value} Pokémon`);
        button.addEventListener('click', () => chooseAnswer(value, button));
        ui.answers.append(button);
      });
      if (focusAnswers) {
        ui.announcement.textContent = `Question ${state.round}. ${question.a} plus ${question.b}. How many Pokémon altogether?`;
        ui.answers.firstElementChild.focus({ preventScroll: true });
      }
    }
    function chooseAnswer(value, button) {
      if (state.answered || button.disabled) return;
      const q = state.question;
      if (value !== q.total) {
        button.disabled = true;
        button.classList.add('wrong');
        button.setAttribute('aria-label', `${value} Pokémon. Try another answer.`);
        ui.feedback.textContent = 'Let’s count again. Try another number!';
        ui.feedback.className = 'feedback retry';
        ui.announcement.textContent = `${value} is not quite right. Count both groups and try again.`;
        return;
      }
      state.answered = true;
      state.solved++;
      ui.score.textContent = `${state.solved} solved`;
      ui['result-copy'].textContent = `${q.total} Pokémon altogether. Great counting!`;
      renderSprites(ui['total-group'], q.total, q.pokemon, true);
      renderEquation(ui['result-equation'], q.a, q.b, q.total);
      ui['question-view'].hidden = true;
      ui['result-view'].hidden = false;
      ui.announcement.textContent = `You got it! ${q.a} plus ${q.b} equals ${q.total}. ${q.total} Pokémon altogether.`;
      ui.next.focus({ preventScroll: true });
    }
    document.getElementById('difficulty').addEventListener('change', event => {
      if (event.target.name !== 'limit') return;
      state.limit = Number(event.target.value);
      newQuestion();
      ui.announcement.textContent = `Addition up to ${state.limit}. ${state.question.a} plus ${state.question.b}. How many Pokémon altogether?`;
    });
    ui.next.addEventListener('click', () => newQuestion(true));
    if (POKEMON.length) newQuestion();
    else {
      ui.feedback.textContent = 'The Pokémon could not load. Please reopen the game.';
      ui.answers.setAttribute('aria-disabled', 'true');
    }
  </script>
</body>
</html>
